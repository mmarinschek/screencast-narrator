name: Publish npm

# TypeScript client releases: tag v<package.json version>-ts (e.g. v0.4.3-ts).
# Publishing uses npm trusted publishing (OIDC) — the package on npmjs.com must
# have this repo + workflow configured as a trusted publisher; no token secret.

on:
  push:
    tags:
      - "v*-ts"

permissions:
  id-token: write
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libzbar0 ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          make sync-common
          pip install -e api/python-client
          pip install -e ".[dev,e2e]"
          pip install playwright
          playwright install chromium --with-deps
          cd api/typescript-client && npm install && cd ../..
          npm install --no-save playwright
      - name: Run TypeScript client build and tests
        run: cd api/typescript-client && npm run build && npm test
      - name: Run e2e tests recording with the TypeScript client
        run: SCREENCAST_E2E_LANGUAGE=typescript pytest -m e2e -v

  publish:
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Verify tag matches package version
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          TAG_VERSION=${TAG_VERSION%-ts}
          PKG_VERSION=$(node -p "require('./api/typescript-client/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
      - name: Install dependencies
        run: cd api/typescript-client && npm install
      - name: Publish to npm
        # Skip when the version is already on the registry so a tag for a
        # locally published release (or a workflow re-run) stays green.
        run: |
          cd api/typescript-client
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "screencast-narrator@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "screencast-narrator@$PKG_VERSION already on npm — skipping publish"
          else
            npm publish
          fi
